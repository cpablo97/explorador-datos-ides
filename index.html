<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>IDES Bogotá — Explore el índice</title>
    <meta name="description" content="Explora en una narrativa guiada por scroll qué es el Índice de Derecho a la Salud (IDES), sus tres dimensiones y los indicadores reales que lo componen en Bogotá." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/explorador.css" />
    <link rel="stylesheet" href="css/scrollytelling-intro.css" />

    <!-- KaTeX: renderiza formula_calculo_latex de data/fichas-tecnicas.json
         (LaTeX real, no texto plano) en los pasos de indicador — mismo
         patrón que ficha.html / js/ficha-tecnica-template.js. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  </head>
  <body>
    <div class="grid-fondo" id="grid-fondo"></div>

    <div class="page">
      <div id="nav-real">
        <ul>
          <li class="is-active"><a href="#">Inicio</a></li>
          <li><a href="explorador.html">Explorador de Datos</a></li>
          <li><a href="indicadores.html">Indicadores</a></li>
          <li><a href="metodologia.html">Metodología</a></li>
          <li><a href="preguntas-frecuentes.html">Preguntas Frecuentes</a></li>
        </ul>
      </div>

      <div id="breadcrumb"></div>

      <!-- Acto 0 — Portada -->
      <section class="acto0" id="acto0">
        <h1 class="acto0__titular" id="acto0-titular"></h1>
        <a class="acto0__cta" id="acto0-cta" href="#acto1"></a>
      </section>

      <!-- Acto 1 — El problema con contar -->
      <section class="acto1" id="acto1">
        <div class="scrolly-grid">
          <div class="scrolly-visual">
            <div class="acto1-card" id="acto1-card">
              <p class="acto1-card__cifra"></p>
              <p class="acto1-card__fuente"></p>
            </div>
          </div>

          <div class="scrolly-narrativa">
            <div class="scrolly-step" data-act="1" data-step="0">
              <p class="scrolly-step__texto"></p>
            </div>
            <div class="scrolly-step" data-act="1" data-step="1">
              <p class="scrolly-step__texto"></p>
            </div>
            <div class="scrolly-step" data-act="1" data-step="2">
              <p class="scrolly-step__texto"></p>
            </div>
          </div>
        </div>

        <!-- Fuera del grid de 2 columnas a propósito: al ocupar todo el
             ancho de la página, el bloque de .scrolly-grid (donde vive el
             panel sticky) termina justo antes de este párrafo — así, al
             hacer scroll hasta acá, la tarjeta se despega y sube con el
             resto del contenido en vez de seguir fija. Esta misma frase
             es el puente temático hacia el Acto 2 (introduce "un índice"). -->
        <p class="acto1__cierre" id="acto1-cierre"></p>
      </section>

      <!-- Explicación — Acto 2+3+4 fusionados: qué es el IDES, sus 3
           dimensiones, y cada indicador real que las compone. Una sola
           sección/.scrolly-visual/.scrolly-narrativa (ver [[project-scrollytelling-acto2-continuidad]]:
           un solo Scrollama observa data-step correlativo de TODA la
           página) para que el zoom "3 filas → 1 dimensión → siguiente
           dimensión → 3 filas" sea una transición real, no un corte. Los
           ~34 pasos de .scrolly-narrativa se generan en JS (ver
           construirPasosExplicacion en scrollytelling-intro.js) porque su
           contenido sale 100% de data/fichas-tecnicas.json +
           data/interpretaciones-indicadores.json — no tiene sentido
           escribirlos a mano acá. -->
      <section class="explicacion" id="explicacion">
        <div class="scrolly-grid">
          <div class="scrolly-visual">
            <div class="explicacion-diagram" id="explicacion-diagram">
              <!-- Estado A (paso 0 de intro): sin beeswarm todavía — solo las 3
                   palabras grandes, cada una subrayada en su color de
                   dimensión. Conservado tal cual del Acto 2 anterior. -->
              <div class="acto2-palabras" id="acto2-palabras">
                <!-- Placa de fondo difuminada (backdrop-filter + mask-image
                     en el mismo elemento, ver css) — separarlos en dos
                     elementos se probó y no funciona en ningún navegador. -->
                <div class="scrolly-backdrop" aria-hidden="true"></div>
                <p class="acto2-palabra acto2-palabra--salud">Salud</p>
                <p class="acto2-palabra acto2-palabra--justicia">Justicia</p>
                <p class="acto2-palabra acto2-palabra--determinantes">Determinantes Sociales</p>
              </div>

              <!-- Estado B (paso 1 de intro en adelante): panel de beeswarm
                   genérico (renderBeeswarmPanel, D3 + d3-force, ver
                   scrollytelling-intro.js) — un <svg> con 1 o 3 filas de 21
                   nodos (localidades) cada una, más overlays HTML posicionados
                   encima para los nombres de fila (subrayado Sora SemiBold) y
                   las anotaciones de Bogotá. -->
              <div class="beeswarm-panel" id="beeswarm-panel">
                <div class="scrolly-backdrop" aria-hidden="true"></div>
                <svg class="beeswarm-panel__svg" id="beeswarm-svg" viewBox="0 0 640 460" aria-hidden="true"></svg>
                <div class="beeswarm-panel__overlays" id="beeswarm-overlays"></div>
              </div>

              <!-- Badge persistente "Salud · indicador 4 de 8" — solo visible
                   durante los pasos de indicador (ver setProgreso en JS). -->
              <p class="explicacion-progreso" id="explicacion-progreso"></p>
            </div>
          </div>

          <div class="scrolly-narrativa" id="explicacion-narrativa"></div>
        </div>

        <a class="btn-outline explicacion-cta" id="explicacion-cta" href="explorador.html">
          <span id="explicacion-cta-texto"></span>
        </a>
      </section>
    </div>

    <script src="js/breadcrumb.js"></script>
    <script src="js/stats-donuts.js"></script>
    <!-- Versiones fijadas a un número exacto (antes sin pin en scrollama, y
         solo a major en d3/gsap): sin esto, una actualización del CDN
         puede cambiar de versión sola en cualquier momento y romper la
         pieza sin que se haya tocado una sola línea de código acá. -->
    <script src="https://unpkg.com/scrollama@3.2.0/build/scrollama.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <script src="js/scrollytelling-intro.js"></script>
    <script>
      IDESBreadcrumb.render(document.getElementById("breadcrumb"), [{ label: "Inicio" }]);
      ScrollytellingIntro.init();
    </script>
  </body>
</html>
