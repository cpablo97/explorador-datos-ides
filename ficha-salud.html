<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDES Bogotá — Fichas técnicas: Salud (prototipo)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/explorador.css" />
    <link rel="stylesheet" href="css/ficha-dimension.css" />
  </head>
  <body>
    <div class="grid-fondo" id="grid-fondo"></div>
    <div class="page ficha-page ficha-page--salud">
      <div id="nav-real">
        <ul>
          <li><a href="#">Inicio</a></li>
          <li><a href="index.html">Explorador de Datos</a></li>
          <li class="is-active"><a href="indicadores.html">Indicadores</a></li>
          <li><a href="metodologia.html">Metodología</a></li>
          <li><a href="preguntas-frecuentes.html">Preguntas Frecuentes</a></li>
        </ul>
      </div>

      <div id="breadcrumb"></div>

      <section class="ficha-hero">
        <div class="ficha-hero__inner">
          <h1 class="ficha-hero__title">
            <span class="ficha-hero__title-line ficha-hero__title-line--intro">Consulte las fichas técnicas de los indicadores en</span>
            <span class="ficha-hero__title-line ficha-hero__title-line--dim" id="ficha-dimension-label"></span>
          </h1>
          <div class="ficha-hero__mark" id="ficha-mark"></div>
        </div>
      </section>

      <section class="ficha-grid" id="ficha-grid"></section>
    </div>

    <script src="js/breadcrumb.js"></script>
    <script src="js/stats-donuts.js"></script>
    <script src="js/ficha-dimension-template.js"></script>
    <script>
      // Portado tal cual de metodologia.html/index.html (montarGridFondo).
      function montarGridFondo(selector) {
        const contenedor = document.querySelector(selector);
        if (!contenedor) return;
        const TILE = 426.5;
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("width", "100%");
        svg.setAttribute("height", "100%");
        const defs = document.createElementNS(svgNS, "defs");
        const pattern = document.createElementNS(svgNS, "pattern");
        pattern.setAttribute("id", "grid-fondo-pattern");
        pattern.setAttribute("patternUnits", "userSpaceOnUse");
        pattern.setAttribute("width", TILE);
        pattern.setAttribute("height", TILE);
        function trazo(tag, attrs) {
          const el = document.createElementNS(svgNS, tag);
          Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
          el.style.stroke = "var(--color-decorative-grid)";
          el.style.strokeOpacity = "0.1";
          el.style.strokeWidth = "1";
          return el;
        }
        pattern.appendChild(trazo("rect", { width: TILE, height: TILE, fill: "none" }));
        pattern.appendChild(
          trazo("circle", { cx: TILE / 2, cy: TILE / 2, r: TILE / 2, fill: "none" }),
        );
        pattern.appendChild(trazo("line", { x1: 0, y1: 0, x2: TILE, y2: TILE }));
        pattern.appendChild(trazo("line", { x1: TILE, y1: 0, x2: 0, y2: TILE }));
        defs.appendChild(pattern);
        svg.appendChild(defs);
        const fondo = document.createElementNS(svgNS, "rect");
        fondo.setAttribute("width", "100%");
        fondo.setAttribute("height", "100%");
        fondo.setAttribute("fill", "url(#grid-fondo-pattern)");
        svg.appendChild(fondo);
        contenedor.appendChild(svg);
      }
      montarGridFondo("#grid-fondo");

      IDESBreadcrumb.render(document.getElementById("breadcrumb"), [
        { label: "Inicio", href: "#" },
        { label: "Indicadores", href: "indicadores.html" },
        { label: "Salud" },
      ]);

      // 8 indicadores reales de Salud, desde data/fichas-tecnicas.json —
      // cada tarjeta enlaza a su propia ficha técnica (ficha.html?id=...).
      (async function () {
        const data = await fetch("data/fichas-tecnicas.json").then((r) => r.json());
        IDESFichaTemplate.render({
          dimensionLabel: "Salud",
          rotaciones: [360, 192, 132],
          indicadores: data.indicadores
            .filter((i) => i.dimension === "Salud")
            .map((i) => ({
              nombre: i.nombre_indicador,
              href: `ficha.html?id=${i.id}`,
            })),
        });
      })();
    </script>
  </body>
</html>
